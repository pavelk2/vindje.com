<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vindje — De Stijl</title>
<link href="assets/fonts/01-de-stijl.css" rel="stylesheet">
<style>
  :root { --line: #111; --red: #d40920; --blue: #1356a2; --yellow: #f7d842; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #f6f4ee; font-family: 'Archivo', sans-serif; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px;
          background: var(--line); padding: 10px; min-height: 100vh; }
  .cell { background: #fff; padding: 22px; position: relative; overflow: hidden; }
  .solid { padding: 0; }
  .r { background: var(--red); } .b { background: var(--blue); } .y { background: var(--yellow); }

  .brand { grid-column: span 3; display: flex; align-items: flex-end; }
  .brand h1 { font-family: 'Archivo Black', 'Archivo', sans-serif; font-weight: 900; font-size: 54px; letter-spacing: -.03em; line-height: .9; }
  .brand h1 span { color: var(--red); }
  .wish { grid-column: span 6; }
  .wish label { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #999; }
  .wish p { font-size: 21px; font-weight: 600; line-height: 1.3; margin-top: 8px; letter-spacing: -.01em; }
  .score { grid-column: span 2; background: var(--yellow); display: flex; flex-direction: column; justify-content: flex-end; }
  .score b { font-family: 'Archivo Black', 'Archivo', sans-serif; font-weight: 900; font-size: 76px; line-height: .85; }
  .score i { font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .sq1 { grid-column: span 1; }

  .toks { grid-column: span 12; background: #fff; display: flex; gap: 0; padding: 0; }
  .tok { padding: 14px 22px; font-weight: 700; font-size: 13px; letter-spacing: .06em;
         text-transform: uppercase; border-right: 10px solid var(--line); display: flex; align-items: center; }
  .tok.dark { background: #111; color: #fff; }
  .tok.fill { flex: 1; border-right: 0; color: #999; font-weight: 600; text-transform: none; letter-spacing: 0; }

  .card { padding: 0; display: flex; flex-direction: column; }
  .card .ph { aspect-ratio: 4/3; overflow: hidden; border-bottom: 10px solid var(--line); }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .tx { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; }
  .card h3 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .card .price { font-family: 'Archivo Black', 'Archivo', sans-serif; font-weight: 900; font-size: 40px; margin: 10px 0 4px; }
  .card .loc { font-size: 12.5px; font-weight: 600; color: #777; letter-spacing: .04em; text-transform: uppercase; }
  .card .why { margin-top: auto; padding-top: 14px; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .card .why::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 8px; }
  .m1 .why::before { background: var(--red); } .m2 .why::before { background: var(--blue); }
  .m3 .why::before { background: var(--yellow); }
  .big { grid-column: span 6; } .big .ph { aspect-ratio: 16/8.4; }
  .med { grid-column: span 3; }
  .flag { position: absolute; top: 0; right: 0; padding: 8px 14px; font-family: 'Archivo Black', 'Archivo', sans-serif; font-weight: 900;
          font-size: 12px; letter-spacing: .1em; color: #fff; background: var(--red); }
  .flag.blue { background: var(--blue); } .flag.yellow { background: var(--yellow); color: #111; }

  .rejhead { grid-column: span 2; background: #111; color: #fff; display: flex; align-items: center; }
  .rejhead h2 { font-family: 'Archivo Black', 'Archivo', sans-serif; font-weight: 900; font-size: 22px; line-height: 1.05; }
  .rej { grid-column: span 2; padding: 16px 18px; }
  .rej img { width: 100%; aspect-ratio: 4/3; object-fit: cover; filter: grayscale(1) contrast(.85); opacity: .55; }
  .rej h4 { font-size: 12.5px; margin-top: 10px; line-height: 1.25; }
  .rej p { font-size: 11.5px; color: var(--red); font-weight: 700; margin-top: 5px; }
  .foot { grid-column: span 12; background: #111; color: #fff; display: flex; justify-content: space-between;
          padding: 16px 22px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script src="assets/data.js"></script>
<script>
const D = window.VINDJE, esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const M = D.listings.filter(l => l.status === 'match');
const R = D.listings.filter(l => l.status === 'reject');
const flags = ['','blue','yellow'], ms = ['m1','m2','m3'];
let h = `
  <div class="cell brand"><h1>vind<span>je</span>.</h1></div>
  <div class="cell wish"><label>Uw wens</label><p>${esc(D.wish)}</p></div>
  <div class="cell score"><b>${D.stats.matched}</b><i>echte matches</i></div>
  <div class="cell solid sq1 r"></div>
  <div class="toks cell solid">
    <div class="tok dark">${esc(D.interpreted.terms)}</div>
    <div class="tok">${esc(D.interpreted.price)}</div>
    <div class="tok">${esc(D.interpreted.distance)}</div>
    <div class="tok">32 gescand van 18.239</div>
    <div class="tok fill">AI las elke advertentie — alleen wat écht klopt staat hieronder</div>
  </div>`;
M.forEach((l, i) => {
  const big = i < 2;
  h += `<div class="cell card ${big ? 'big' : 'med'} ${ms[i % 3]}">
    <div class="flag ${flags[i % 3]}">MATCH №${i + 1}</div>
    <div class="ph"><img src="${l.photo}"></div>
    <div class="tx"><h3>${esc(l.title)}</h3>
      <div class="price">${esc(l.price)}</div>
      <div class="loc">${esc(l.city)} · ${l.km} km</div>
      <div class="why">${esc(l.why)}</div></div>
  </div>`;
});
h += `<div class="cell rejhead"><h2>AFGE-<br>KEURD</h2></div>`;
R.slice(0, 5).forEach(l => {
  h += `<div class="cell rej"><img src="${l.photo}"><h4>${esc(l.title)}</h4><p>× ${esc(l.whyNot)}</p></div>`;
});
h += `<div class="foot"><span>vindje.com — slim zoeken op Marktplaats</span><span>ontwerp naar De Stijl, 1917 → 2026</span></div>`;
document.getElementById('g').innerHTML = h;
</script>
</body>
</html>
