<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vindje — The Museum</title>
<link href="assets/fonts/03-museum.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #244034; color: #1c1a16; font-family: 'Cormorant Garamond', serif; }
  .wall { background: linear-gradient(#2a4a3c, #1f3a2e); padding: 60px 40px 70px; position: relative; }
  .wall::after { content: ''; position: absolute; inset: auto 0 0 0; height: 26px;
                 background: #ece7db; box-shadow: 0 -1px 0 rgba(0,0,0,.25); }
  .mast { text-align: center; color: #e9e2d0; margin-bottom: 8px; }
  .mast .k { font-family: 'Inter'; font-size: 11px; letter-spacing: .5em; text-transform: uppercase; color: #b9c9ae; }
  .mast h1 { font-size: 64px; font-weight: 500; letter-spacing: .02em; margin: 10px 0 6px; }
  .mast p { font-style: italic; font-size: 20px; color: #cfc8ae; max-width: 720px; margin: 0 auto; line-height: 1.4; }
  .rule { width: 120px; height: 1px; background: #8fa08a; margin: 26px auto; position: relative; }
  .rule::after { content: '❦'; position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
                 color: #b9c9ae; background: transparent; font-size: 15px; padding: 0 10px; }

  .salon { display: flex; flex-wrap: wrap; justify-content: center; gap: 56px 46px;
           max-width: 1340px; margin: 26px auto 0; align-items: flex-start; }
  .piece { width: 360px; }
  .piece.grand { width: 470px; }
  .frame { background: linear-gradient(135deg, #8a6b32, #c8a659 30%, #7d5f2b 65%, #b5964d);
           padding: 16px; box-shadow: 0 22px 45px rgba(0,0,0,.5), inset 0 0 0 2px rgba(0,0,0,.35); }
  .mat { background: #f5f1e6; padding: 26px; box-shadow: inset 0 0 12px rgba(0,0,0,.18); }
  .mat img { width: 100%; aspect-ratio: 4/3.4; object-fit: cover; display: block;
             box-shadow: 0 0 0 1px rgba(0,0,0,.28); }
  .spot { position: relative; }
  .spot::before { content: ''; position: absolute; left: 50%; top: -60px; transform: translateX(-50%);
    width: 130%; height: 150%; background: radial-gradient(ellipse at top, rgba(255,244,200,.16), transparent 65%);
    pointer-events: none; }
  .plaque { margin: 18px auto 0; width: 88%; background: linear-gradient(#d9c489, #b89a54);
            border: 1px solid #8a6f33; padding: 13px 16px 12px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,.35); color: #241d0d; }
  .plaque h3 { font-size: 19px; font-weight: 600; line-height: 1.15; }
  .plaque .fact { font-family: 'Inter'; font-size: 10.5px; letter-spacing: .12em;
                  text-transform: uppercase; margin-top: 5px; color: #4a3c17; }
  .plaque .note { font-style: italic; font-size: 14.5px; margin-top: 7px; line-height: 1.3; }
  .plaque .note b { font-style: normal; font-family: 'Inter'; font-size: 10px; letter-spacing: .14em;
                    text-transform: uppercase; display: block; margin-bottom: 2px; color: #57430f; }

  .depot { background: #ece7db; padding: 44px 40px 60px; }
  .depot-in { max-width: 1240px; margin: 0 auto; }
  .depot h2 { font-size: 30px; font-weight: 500; }
  .depot .sub { font-family: 'Inter'; font-size: 12px; color: #7c7466; margin: 6px 0 26px;
                letter-spacing: .06em; }
  .bins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
  .bin { text-align: center; }
  .bin img { width: 100%; aspect-ratio: 4/3; object-fit: cover; filter: grayscale(.9) sepia(.15);
             opacity: .7; border: 1px solid #c9c2b2; }
  .bin h4 { font-size: 16px; font-weight: 600; margin-top: 10px; line-height: 1.15; }
  .bin p { font-style: italic; font-size: 13.5px; color: #8a6a5a; margin-top: 3px; }
  .colophon { text-align: center; font-family: 'Inter'; font-size: 11px; letter-spacing: .3em;
              text-transform: uppercase; color: #99917f; margin-top: 48px; }
</style>
</head>
<body>
<div class="wall">
  <div class="mast">
    <div class="k">vindje.com presenteert</div>
    <h1>The Found Objects</h1>
    <p id="wish"></p>
  </div>
  <div class="rule"></div>
  <div class="mast" style="margin-bottom:34px">
    <div class="k" style="letter-spacing:.35em">Zaal I — zes werken, gekozen uit 18.239 · conservator: A.I.</div>
  </div>
  <div class="salon" id="salon"></div>
</div>
<div class="depot">
  <div class="depot-in">
    <h2>Het depot <span style="font-style:italic;font-weight:400">— niet tentoongesteld</span></h2>
    <div class="sub">26 werken door de conservator terzijde gelegd — een selectie, met reden van afwijzing</div>
    <div class="bins" id="bins"></div>
    <div class="colophon">vindje.com · slim zoeken op marktplaats · toegang vrij</div>
  </div>
</div>
<script src="assets/data.js"></script>
<script>
const D = window.VINDJE, esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('wish').textContent = '“' + D.wish + '”';
const M = D.listings.filter(l => l.status === 'match');
document.getElementById('salon').innerHTML = M.map((l, i) => `
  <div class="piece ${i === 0 ? 'grand' : ''}">
    <div class="spot"><div class="frame"><div class="mat"><img src="${l.photo}"></div></div></div>
    <div class="plaque">
      <h3>${esc(l.title)}</h3>
      <div class="fact">${esc(l.price)} · ${esc(l.city)} · ${l.km} km · nr. ${i + 1}</div>
      <div class="note"><b>Notitie van de conservator</b>“${esc(l.why)}”</div>
    </div>
  </div>`).join('');
document.getElementById('bins').innerHTML =
  D.listings.filter(l => l.status !== 'match').slice(0, 5).map(l => `
  <div class="bin"><img src="${l.photo}"><h4>${esc(l.title)}</h4><p>${esc(l.whyNot)}</p></div>`).join('');
</script>
</body>
</html>
