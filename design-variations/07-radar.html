<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vindje — Radar</title>
<link href="assets/fonts/07-radar.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  :root { --grid: #0f2f26; --ph: #2df5a5; --dim: #12805e; --warn: #ffcb3d; --bad: #ff4d5e; }
  body { background: radial-gradient(circle at 30% 20%, #07211a, #030d0b 70%);
         color: var(--ph); font-family: 'Share Tech Mono', monospace; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 20px 34px; border-bottom: 1px solid var(--grid); }
  header h1 { font-family: 'Orbitron'; font-size: 24px; letter-spacing: .3em; }
  header h1 i { font-style: normal; color: var(--warn); }
  header .stat { font-size: 13px; color: var(--dim); text-align: right; line-height: 1.5; }
  header .stat b { color: var(--ph); }
  .wishline { padding: 12px 34px; border-bottom: 1px solid var(--grid); font-size: 14px; color: #7fd9b8; }
  .wishline b { color: var(--warn); }

  main { display: grid; grid-template-columns: 700px 1fr; gap: 0; }
  .scope { position: relative; height: 760px; display: flex; align-items: center; justify-content: center;
           border-right: 1px solid var(--grid); }
  .radar { position: relative; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, #05261d 0%, #04170f 70%);
    border: 2px solid var(--dim);
    box-shadow: 0 0 60px rgba(45,245,165,.14), inset 0 0 80px rgba(0,0,0,.6); }
  .ring { position: absolute; border: 1px solid var(--grid); border-radius: 50%; }
  .cross-h, .cross-v { position: absolute; background: var(--grid); }
  .cross-h { left: 0; right: 0; top: 50%; height: 1px; }
  .cross-v { top: 0; bottom: 0; left: 50%; width: 1px; }
  .sweep { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 40deg, rgba(45,245,165,.38), transparent 70deg); }
  .rlabel { position: absolute; left: 51%; color: var(--dim); font-size: 11px; }
  .blip { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%,-50%); }
  .blip.m { background: var(--ph); box-shadow: 0 0 14px var(--ph), 0 0 30px rgba(45,245,165,.5); }
  .blip.r { width: 10px; height: 10px; background: transparent; border: 2px solid var(--bad);
            box-shadow: 0 0 8px rgba(255,77,94,.5); opacity: .8; }
  .blip.u { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .btag { position: absolute; transform: translate(10px,-50%); white-space: nowrap; font-size: 11.5px;
          color: var(--ph); background: rgba(4,23,15,.85); border: 1px solid var(--dim);
          padding: 2px 7px; }
  .btag b { color: var(--warn); }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            color: var(--warn); font-size: 18px; }
  .scope .cap { position: absolute; bottom: 26px; text-align: center; width: 100%;
                color: var(--dim); font-size: 12px; letter-spacing: .2em; }

  .list { padding: 22px 30px; }
  .list h2 { font-family: 'Orbitron'; font-size: 15px; letter-spacing: .24em; color: var(--warn);
             margin-bottom: 14px; }
  .trk { display: grid; grid-template-columns: 88px 64px 1fr 90px; gap: 14px; align-items: center;
         border: 1px solid var(--grid); margin-bottom: 10px; padding: 10px 14px;
         background: rgba(45,245,165,.03); }
  .trk.lock { border-color: var(--ph); background: rgba(45,245,165,.07);
              box-shadow: 0 0 18px rgba(45,245,165,.12); }
  .trk.lost { opacity: .38; }
  .tid { font-size: 11px; color: var(--dim); line-height: 1.6; }
  .tid b { display: block; color: var(--ph); font-size: 13px; }
  .trk img { width: 64px; height: 48px; object-fit: cover;
             filter: sepia(1) hue-rotate(90deg) saturate(2.4) brightness(.8); border: 1px solid var(--dim); }
  .tinfo { font-size: 13px; line-height: 1.5; }
  .tinfo .nm { color: #d9fff0; font-size: 14px; }
  .tinfo .why { color: #7fd9b8; }
  .tinfo .why.bad { color: #ff9aa4; }
  .tright { text-align: right; font-size: 12px; color: var(--dim); line-height: 1.6; }
  .tright .px { color: var(--warn); font-size: 16px; }
  .lockchip { display: inline-block; font-size: 10px; letter-spacing: .18em; padding: 2px 7px;
              border: 1px solid currentColor; margin-bottom: 3px; }
  .lock .lockchip { color: var(--ph); } .lost .lockchip { color: var(--bad); }
  .u .lockchip { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>VNDJE<i>▮</i>RADAR</h1>
  <div class="stat"><b>SECTOR:</b> NL-WEST · POSTCODE 1012AB<br><b>SWEEP 32/32</b> · 18,239 ECHOES · 6 TARGETS LOCKED</div>
</header>
<div class="wishline"><b>MISSION:</b> <span id="wish"></span></div>
<main>
  <div class="scope">
    <div class="radar" id="radar">
      <div class="cross-h"></div><div class="cross-v"></div>
      <div class="sweep"></div>
      <div class="center">◎</div>
    </div>
    <div class="cap">RANGE RINGS: 15 / 30 / 45 / 60 KM — YOU ARE AT CENTER</div>
  </div>
  <div class="list">
    <h2>▸ TARGET LIST — SORTED BY RANGE</h2>
    <div id="trks"></div>
  </div>
</main>
<script src="assets/data.js"></script>
<script>
const D = window.VINDJE, esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('wish').textContent = D.wish.toUpperCase();
const radar = document.getElementById('radar'), SZ = 620, C = SZ / 2, MAXKM = 62;
// rings at 15/30/45/60 km
[15, 30, 45, 60].forEach(km => {
  const r = km / MAXKM * C;
  radar.insertAdjacentHTML('beforeend',
    `<div class="ring" style="left:${C - r}px;top:${C - r}px;width:${2 * r}px;height:${2 * r}px"></div>
     <div class="rlabel" style="top:${C - r - 14}px">${km}</div>`);
});
const angles = [332, 25, 68, 118, 155, 208, 250, 288, 10, 95, 190, 300];
const sorted = [...D.listings].sort((a, b) => a.km - b.km);
sorted.forEach((l, i) => {
  const a = angles[i % angles.length] * Math.PI / 180, r = Math.min(l.km, 60) / MAXKM * C;
  const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
  const cls = l.status === 'match' ? 'm' : l.status === 'reject' ? 'r' : 'u';
  radar.insertAdjacentHTML('beforeend', `<div class="blip ${cls}" style="left:${x}px;top:${y}px"></div>` +
    (l.status === 'match' ? `<div class="btag" style="left:${x}px;top:${y}px"><b>${esc(l.price)}</b> ${esc(l.city.toUpperCase())}</div>` : ''));
});
document.getElementById('trks').innerHTML = sorted.map((l, i) => {
  const st = l.status === 'match' ? 'lock' : l.status === 'reject' ? 'lost' : 'u';
  const chip = l.status === 'match' ? 'TARGET LOCKED' : l.status === 'reject' ? 'DISMISSED' : 'UNVERIFIED';
  return `<div class="trk ${st}">
    <div class="tid"><b>TRK-${String(i + 1).padStart(2, '0')}</b>${esc(l.id)}</div>
    <img src="${l.photo}">
    <div class="tinfo"><div class="nm">${esc(l.title.toUpperCase())}</div>
      <div class="why ${l.status === 'reject' ? 'bad' : ''}">${l.status === 'match' ? '» ' + esc(l.why) : '» ' + esc(l.whyNot)}</div></div>
    <div class="tright"><span class="lockchip">${chip}</span><br><span class="px">${esc(l.price.replace(' (bid from)',''))}</span><br>${l.km} KM · ${esc(l.city.toUpperCase())}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
